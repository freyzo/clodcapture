<svg viewBox="0 0 256 256" width="320" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D lighting filter: bevel + specular + ambient -->
    <filter id="f3d" x="-10%" y="-10%" width="120%" height="120%">
      <!-- surface normal from alpha -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <!-- top-left key light (like 3dsvg lightPosition [5,8,5]) -->
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="0.8" specularExponent="25" result="spec" lighting-color="#fff5ee">
        <fePointLight x="-40" y="-60" z="120"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specMask"/>
      <!-- diffuse lighting for body shading -->
      <feDiffuseLighting in="blur" surfaceScale="4" diffuseConstant="1.0" result="diff" lighting-color="#ffeedd">
        <fePointLight x="-30" y="-50" z="100"/>
      </feDiffuseLighting>
      <feComposite in="diff" in2="SourceAlpha" operator="in" result="diffMask"/>
      <!-- combine: source + diffuse + specular -->
      <feComposite in="SourceGraphic" in2="diffMask" operator="arithmetic" k1="0" k2="0.6" k3="0.4" k4="0" result="lit"/>
      <feComposite in="lit" in2="specMask" operator="arithmetic" k1="0" k2="1" k3="0.45" k4="0"/>
    </filter>

    <!-- drop shadow for depth/extrusion illusion -->
    <filter id="fShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="shadowBlur"/>
      <feOffset dx="3" dy="5" result="shadowOff"/>
      <feFlood flood-color="#0a0812" flood-opacity="0.55" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOff" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- body gradient: simulates curved metallic surface -->
    <radialGradient id="gBody" cx="0.4" cy="0.3" r="0.65" fx="0.35" fy="0.25">
      <stop offset="0%" stop-color="#f4a078"/>
      <stop offset="40%" stop-color="#D97757"/>
      <stop offset="75%" stop-color="#b85a3a"/>
      <stop offset="100%" stop-color="#8a3d22"/>
    </radialGradient>

    <!-- head gradient -->
    <radialGradient id="gHead" cx="0.4" cy="0.3" r="0.7" fx="0.35" fy="0.2">
      <stop offset="0%" stop-color="#f0a585"/>
      <stop offset="35%" stop-color="#D97757"/>
      <stop offset="70%" stop-color="#c0643f"/>
      <stop offset="100%" stop-color="#8a3d22"/>
    </radialGradient>

    <!-- leg gradient: top-lit metallic tube -->
    <linearGradient id="gLeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a080"/>
      <stop offset="30%" stop-color="#D97757"/>
      <stop offset="70%" stop-color="#b85a3a"/>
      <stop offset="100%" stop-color="#7a3018"/>
    </linearGradient>

    <!-- specular highlight overlay for body -->
    <radialGradient id="gSpec" cx="0.38" cy="0.28" r="0.35" fx="0.35" fy="0.22">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- ambient occlusion for underside -->
    <linearGradient id="gAO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="70%" stop-color="rgba(0,0,0,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </linearGradient>
  </defs>

  <!-- NO background rect - transparent -->

  <!-- Main spider group with 3D filter stack -->
  <g transform="translate(128,122) scale(1.45)" filter="url(#fShadow)">

    <!-- === EXTRUSION LAYER: offset dark copy for depth === -->
    <g transform="translate(1.5, 2.5)" opacity="0.4">
      <g fill="#6b2f18">
        <ellipse cx="0" cy="-12" rx="14" ry="13"/>
        <path d="M-18,0 C-19,18 -14,38 0,44 C14,38 19,18 18,0 C14,-6 -14,-6 -18,0Z"/>
      </g>
      <g stroke="#6b2f18" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-10,-10 L-18,-28 L-30,-38 L-36,-35"/>
        <path d="M10,-10 L18,-28 L30,-38 L36,-35"/>
        <path d="M-12,-4 L-24,-18 L-40,-20 L-48,-14"/>
        <path d="M12,-4 L24,-18 L40,-20 L48,-14"/>
        <path d="M-14,4 L-28,0 L-44,8 L-52,16"/>
        <path d="M14,4 L28,0 L44,8 L52,16"/>
        <path d="M-12,14 L-24,24 L-36,42 L-40,52"/>
        <path d="M12,14 L24,24 L36,42 L40,52"/>
      </g>
    </g>

    <!-- === LEGS with gradient + edge highlight === -->
    <!-- Shadow/depth layer -->
    <g stroke="rgba(10,8,18,0.5)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10,-10 L-18,-28 L-30,-38 L-36,-35"/>
      <path d="M10,-10 L18,-28 L30,-38 L36,-35"/>
      <path d="M-12,-4 L-24,-18 L-40,-20 L-48,-14"/>
      <path d="M12,-4 L24,-18 L40,-20 L48,-14"/>
      <path d="M-14,4 L-28,0 L-44,8 L-52,16"/>
      <path d="M14,4 L28,0 L44,8 L52,16"/>
      <path d="M-12,14 L-24,24 L-36,42 L-40,52"/>
      <path d="M12,14 L24,24 L36,42 L40,52"/>
    </g>

    <!-- Main leg color with metallic shading -->
    <g stroke="url(#gLeg)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10,-10 L-18,-28 L-30,-38 L-36,-35"/>
      <path d="M10,-10 L18,-28 L30,-38 L36,-35"/>
      <path d="M-12,-4 L-24,-18 L-40,-20 L-48,-14"/>
      <path d="M12,-4 L24,-18 L40,-20 L48,-14"/>
      <path d="M-14,4 L-28,0 L-44,8 L-52,16"/>
      <path d="M14,4 L28,0 L44,8 L52,16"/>
      <path d="M-12,14 L-24,24 L-36,42 L-40,52"/>
      <path d="M12,14 L24,24 L36,42 L40,52"/>
    </g>

    <!-- Leg highlight (top edge catch light) -->
    <g stroke="rgba(255,220,195,0.2)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-0.5,-1)">
      <path d="M-10,-10 L-18,-28 L-30,-38 L-36,-35"/>
      <path d="M10,-10 L18,-28 L30,-38 L36,-35"/>
      <path d="M-12,-4 L-24,-18 L-40,-20 L-48,-14"/>
      <path d="M12,-4 L24,-18 L40,-20 L48,-14"/>
      <path d="M-14,4 L-28,0 L-44,8 L-52,16"/>
      <path d="M14,4 L28,0 L44,8 L52,16"/>
      <path d="M-12,14 L-24,24 L-36,42 L-40,52"/>
      <path d="M12,14 L24,24 L36,42 L40,52"/>
    </g>

    <!-- Joint dots (3D knuckles) -->
    <g fill="#c06840">
      <circle cx="-18" cy="-28" r="3.5" opacity="0.6"/>
      <circle cx="18" cy="-28" r="3.5" opacity="0.6"/>
      <circle cx="-24" cy="-18" r="3.5" opacity="0.6"/>
      <circle cx="24" cy="-18" r="3.5" opacity="0.6"/>
      <circle cx="-28" cy="0" r="3.5" opacity="0.6"/>
      <circle cx="28" cy="0" r="3.5" opacity="0.6"/>
      <circle cx="-24" cy="24" r="3.5" opacity="0.6"/>
      <circle cx="24" cy="24" r="3.5" opacity="0.6"/>
    </g>
    <g fill="#f0a080">
      <circle cx="-18" cy="-28" r="1.8" opacity="0.5"/>
      <circle cx="18" cy="-28" r="1.8" opacity="0.5"/>
      <circle cx="-24" cy="-18" r="1.8" opacity="0.5"/>
      <circle cx="24" cy="-18" r="1.8" opacity="0.5"/>
      <circle cx="-28" cy="0" r="1.8" opacity="0.5"/>
      <circle cx="28" cy="0" r="1.8" opacity="0.5"/>
      <circle cx="-24" cy="24" r="1.8" opacity="0.5"/>
      <circle cx="24" cy="24" r="1.8" opacity="0.5"/>
    </g>

    <!-- === BODY: 3D shaded with PBR lighting filter === -->
    <g filter="url(#f3d)">
      <!-- Head -->
      <ellipse cx="0" cy="-12" rx="14" ry="13" fill="url(#gHead)"/>
      <!-- Abdomen -->
      <path d="M-18,0 C-19,18 -14,38 0,44 C14,38 19,18 18,0 C14,-6 -14,-6 -18,0Z" fill="url(#gBody)"/>
    </g>
    <!-- Head specular (on top of filter) -->
    <ellipse cx="-2" cy="-15" rx="7" ry="6" fill="url(#gSpec)" opacity="0.7"/>
    <!-- Abdomen ambient occlusion -->
    <path d="M-18,0 C-19,18 -14,38 0,44 C14,38 19,18 18,0 C14,-6 -14,-6 -18,0Z" fill="url(#gAO)" opacity="0.5"/>
    <!-- Abdomen specular highlight -->
    <ellipse cx="-3" cy="10" rx="8" ry="12" fill="url(#gSpec)" opacity="0.55"/>

    <!-- Subtle rim light (back edge) -->
    <path d="M-16,2 C-17,16 -13,34 0,40 C13,34 17,16 16,2" stroke="rgba(255,200,170,0.15)" stroke-width="1.5" fill="none"/>

    <!-- Body segment line -->
    <line x1="-12" y1="-1" x2="12" y2="-1" stroke="rgba(80,40,20,0.25)" stroke-width="1.5"/>
  </g>
</svg>