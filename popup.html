<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>clodcapture</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: transparent; }
    body {
      width: 300px; padding: 0;
      background: linear-gradient(160deg, rgba(42,36,48,0.97), rgba(30,26,38,0.98));
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      border-radius: 0; position: relative; overflow: hidden;
      background: linear-gradient(160deg, rgba(42,36,48,0.97), rgba(30,26,38,0.98));
      box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
      border: none;
    }
    .wrap {
      position: relative; z-index: 2; padding: 16px 14px 13px;
      display: flex; flex-direction: column; gap: 9px;
    }

    .logo { display:flex; align-items:center; justify-content:space-between; animation: su .38s cubic-bezier(.34,1.56,.64,1) both; }
    .logo-left { display:flex; align-items:center; gap:8px; }
    .logo-name { font-size: 18px; font-weight: 700; letter-spacing: -.2px; color: rgba(255,240,230,0.9); }
    .logo-right { display:flex; align-items:center; gap:6px; }
    .logo-badge { font-size: 9px; font-weight: 600; letter-spacing: .05em; color: #D97757; background: rgba(217,119,87,0.12); border: 1px solid rgba(217,119,87,0.18); padding: 2px 8px; border-radius: 20px; }
    .gear-btn {
      width: 22px; height: 22px; background: none; border: none; cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.2); border-radius: 6px;
      transition: color .15s, background .15s;
    }
    .gear-btn:hover { color: rgba(217,119,87,0.7); background: rgba(217,119,87,0.06); }
    .gear-btn.active { color: #D97757; }

    .card {
      border-radius: 12px; padding: 11px 12px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.05);
      animation: su .44s cubic-bezier(.34,1.56,.64,1) both; animation-delay:.05s;
    }
    .row { display:flex; flex-direction:column; gap:1px; margin-bottom:7px; }
    .row:last-child { margin-bottom:0; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:rgba(255,240,230,0.22); }
    .val { font-size:11px; font-weight:600; color:rgba(255,240,230,0.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .val.ok  { color:#D97757; }
    .val.dim { color:rgba(255,240,230,0.2); }

    .sync-row { display:flex; align-items:center; gap:6px; }
    .sync-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .sync-dot.green { background:#22c55e; box-shadow:0 0 6px rgba(34,197,94,0.4); }
    .sync-dot.amber { background:#d97706; box-shadow:0 0 6px rgba(217,119,6,0.4); }
    .sync-dot.red { background:#ef4444; box-shadow:0 0 4px rgba(239,68,68,0.3); }

    .settings-panel {
      display: none; flex-direction: column; gap: 8px;
      border-radius: 12px; padding: 11px 12px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.05);
      animation: su .25s ease both;
    }
    .settings-panel.open { display: flex; }
    .settings-lbl { font-size:9px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:rgba(255,240,230,0.22); margin-bottom:2px; }
    .api-row { display:flex; gap:6px; align-items:center; }
    .api-input {
      flex: 1; font-size: 10.5px; font-weight: 500; font-family: 'SF Mono', monospace;
      padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03); color: rgba(255,240,230,0.8); outline: none;
      transition: border-color .15s;
    }
    .api-input::placeholder { color: rgba(255,240,230,0.18); }
    .api-input:focus { border-color: rgba(217,119,87,0.3); }
    .api-save {
      flex-shrink: 0; padding: 5px 10px; border-radius: 8px; font-size: 10.5px; font-weight: 700;
      font-family: inherit; cursor: pointer; border: none;
      background: #D97757; color: #1e1a26;
      transition: opacity .15s;
    }
    .api-save:hover { opacity: .85; }
    .api-status { font-size: 9.5px; font-weight: 600; color: rgba(255,240,230,0.25); }
    .api-status.ok  { color: #22c55e; }
    .api-status.err { color: #ef4444; }

    .btn-row { display:flex; gap:7px; }
    .btn {
      flex: 1; padding: 10px 8px; border-radius: 12px; cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 700; color: rgba(255,240,230,0.75);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      position: relative; overflow: hidden;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform .14s cubic-bezier(.34,1.56,.64,1), background .15s, border-color .15s;
      animation: su .48s cubic-bezier(.34,1.56,.64,1) both;
    }
    .btn-full { width:100%; }
    .btn::after { content: ''; position: absolute; top:0; left:-100%; width:50%; height:100%; background: linear-gradient(90deg,transparent,rgba(217,119,87,0.04),transparent); transition: left .4s ease; pointer-events:none; }
    .btn:hover::after { left: 160%; }
    .btn:hover { transform: translateY(-1px); background: rgba(217,119,87,0.06); border-color: rgba(217,119,87,0.15); }
    .btn:active { transform: scale(.97) translateY(1px); background: rgba(255,255,255,0.02); }
    .btn:disabled { opacity:.4; cursor:default; transform:none!important; }
    .b1 { animation-delay:.08s; } .b2 { animation-delay:.12s; } .b3 { animation-delay:.16s; }

    .icon { width:14px; height:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .icon svg { display:block; }

    .prog-wrap { display:flex; flex-direction:column; align-items:center; gap:5px; width:100%; }
    .prog-label { font-size:10px; font-weight:700; color:rgba(217,119,87,0.5); letter-spacing:.08em; text-transform:uppercase; }

    .divider { border:none; border-top:1px solid rgba(255,255,255,0.04); animation: su .5s ease both; animation-delay:.18s; }

    .list-header { display:flex; align-items:center; justify-content:space-between; animation: su .5s ease both; animation-delay:.20s; }
    .list-title { font-size:9px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:rgba(255,240,230,0.22); }
    .list-count { font-size:9px; font-weight:600; color:#D97757; }

    .chat-list {
      max-height: 200px; overflow-y: auto; display:flex; flex-direction:column; gap:4px;
      animation: su .5s ease both; animation-delay:.22s;
    }
    .chat-list::-webkit-scrollbar { width:3px; }
    .chat-list::-webkit-scrollbar-thumb { background:rgba(217,119,87,0.15); border-radius:2px; }

    .chat-item {
      display:flex; align-items:center; gap:8px; padding:7px 10px;
      border-radius:10px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      transition: background .15s, border-color .15s;
    }
    .chat-item:hover { background: rgba(217,119,87,0.04); border-color: rgba(217,119,87,0.1); }
    .chat-info { flex:1; min-width:0; }
    .chat-name { font-size:11px; font-weight:600; color:rgba(255,240,230,0.7); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-meta { font-size:9px; color:rgba(255,240,230,0.22); display:flex; gap:8px; margin-top:1px; }
    .chat-actions { display:flex; gap:2px; flex-shrink:0; }
    .chat-btn {
      width:24px; height:24px; border:none; background:transparent; cursor:pointer; padding:0;
      display:flex; align-items:center; justify-content:center;
      color:rgba(255,240,230,0.18); border-radius:6px; transition: color .15s, background .15s;
    }
    .chat-btn:hover { color:#D97757; background:rgba(217,119,87,0.06); }
    .chat-btn.danger:hover { color:#ef4444; background:rgba(239,68,68,0.06); }
    .chat-btn svg { width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    .empty-list { padding:16px 0; text-align:center; font-size:10px; color:rgba(255,240,230,0.18); }

    .status { display:flex; align-items:center; justify-content:center; gap:5px; font-size:10px; font-weight:600; color:rgba(255,240,230,0.25); animation:su .5s ease both; animation-delay:.25s; }
    .dw { position:relative; width:7px; height:7px; flex-shrink:0; }
    .dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.1); position:absolute; inset:0; }
    .dot.on { background:#D97757; box-shadow:0 0 8px rgba(217,119,87,0.5); }
    .dot-ring { position:absolute; inset:-3px; border-radius:50%; border:1px solid rgba(217,119,87,0.5); opacity:0; }
    .dot.on ~ .dot-ring { animation:ping 2s ease-out infinite; }

    .foot-row { display:flex; align-items:center; justify-content:space-between; animation: su .5s ease both; animation-delay:.28s; }
    .foot-size { font-size:9px; color:rgba(255,240,230,0.13); }

    .ctx-gauge { display:flex; align-items:center; gap:8px; }
    .ctx-ring { position:relative; width:32px; height:32px; flex-shrink:0; }
    .ctx-ring svg { transform:rotate(-90deg); }
    .ctx-pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:800; color:#D97757; letter-spacing:-.02em; transform:rotate(0deg); }
    .ctx-info { display:flex; flex-direction:column; gap:0px; }
    .ctx-label { font-size:8px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,240,230,0.18); }
    .ctx-tokens { font-size:9px; font-weight:600; color:rgba(255,240,230,0.3); }

    @keyframes ping { 0%{transform:scale(.7);opacity:.8} 100%{transform:scale(2.5);opacity:0} }
    @keyframes su   { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
  <div class="shell">
    <div class="wrap">
      <canvas id="spider-canvas" style="width:100%;height:50px;cursor:pointer;border-radius:12px 12px 0 0;"></canvas>
      <div class="logo">
        <div class="logo-left">
          <span class="logo-name"><span style="color:#D97757;">clod</span>capture</span>
        </div>
        <div class="logo-right">
          <button class="gear-btn" id="btn-gear" title="Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <div class="lbl">Current Chat</div>
          <div class="val" id="conv-id">-</div>
        </div>
        <div class="row">
          <div class="lbl">Sync</div>
          <div class="val sync-row">
            <span class="sync-dot red" id="sync-dot"></span>
            <span id="sync-label">-</span>
          </div>
        </div>
      </div>

      <div class="settings-panel" id="settings-panel">
        <div class="settings-lbl">AI Provider API Key</div>
        <div class="api-row">
          <input class="api-input" id="api-key-input" type="password" placeholder="api-key..." autocomplete="off" spellcheck="false">
          <button class="api-save" id="api-save">Save</button>
        </div>
        <div class="api-status" id="api-status">Enables exact token counting</div>
        <div style="height:1px; background:rgba(255,255,255,0.04); margin:4px 0;"></div>
        <div class="settings-lbl">GitHub Backup</div>
        <div class="api-row">
          <input class="api-input" id="gh-repo-input" type="text" placeholder="owner/repo" autocomplete="off" spellcheck="false" style="font-family:inherit;">
        </div>
        <div class="api-row">
          <input class="api-input" id="gh-token-input" type="password" placeholder="ghp_..." autocomplete="off" spellcheck="false">
          <button class="api-save" id="gh-save">Save</button>
        </div>
        <div class="api-row" style="gap:8px;">
          <label style="font-size:10px; font-weight:600; color:rgba(255,240,230,0.3); display:flex; align-items:center; gap:5px; cursor:pointer;">
            <input type="checkbox" id="gh-auto" style="accent-color:#D97757;"> Auto-push on capture
          </label>
        </div>
        <div class="api-status" id="gh-status">Push captured chats to a GitHub repo</div>
        <button class="btn" id="btn-gh-push" style="padding:7px 8px; font-size:10px; animation:none;">
          <span class="icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v3.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V8"/><polyline points="4,5 7,2 10,5"/><line x1="7" y1="2" x2="7" y2="10"/></svg></span>
          <span>Push All to GitHub</span>
        </button>
      </div>

      <div class="btn-row">
        <button class="btn b1" id="btn-copy"></button>
        <button class="btn b2" id="btn-grab"></button>
      </div>
      <button class="btn btn-full b3" id="btn-sync"></button>

      <hr class="divider">

      <div class="list-header">
        <span class="list-title">Captured Chats</span>
        <span class="list-count" id="list-count">0</span>
      </div>
      <div class="chat-list" id="chat-list"></div>

      <div class="status">
        <div class="dw"><div class="dot" id="dot"></div><div class="dot-ring"></div></div>
        <span id="status-msg">-</span>
      </div>

      <div class="foot-row">
        <span class="foot-size" id="foot-size"></span>
        <div class="ctx-gauge" id="ctx-gauge" style="display:none;">
          <div class="ctx-ring" id="ctx-ring"></div>
          <div class="ctx-info">
            <span class="ctx-label">Context</span>
            <span class="ctx-tokens" id="ctx-tokens">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="spider.js"></script>
  <script src="popup.js"></script>
</body>
</html>
